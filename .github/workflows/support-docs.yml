name: Explicit pinned corpus refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Reproduce the committed pin and baseline
        run: go run github.com/magefile/mage@v1.15.0 refreshPreservation
      - name: Export candidate artifacts without committing or pushing
        uses: actions/upload-artifact@v4
        with:
          name: pinned-card-preservation
          path: |
            testdata/card-preservation/
            .cardwork/preservation/refresh-report.json
