name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check:
        description: Check to run
        type: choice
        default: tests
        options:
          - tests
          - lint
          - race

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    if: github.event_name != 'workflow_dispatch' || inputs.check == 'tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            go run ./cmd/ciplan -all
          else
            go run ./cmd/ciplan -base "$BASE" -head HEAD
          fi
      - name: Full test suite
        if: steps.plan.outputs.code == 'true'
        run: go test -v ./...
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.code == 'true'
        with:
          node-version: '24'
      - name: Production workflow tests
        if: steps.plan.outputs.code == 'true'
        run: node --test .github/extensions/council4-production/workflow.test.mjs
      - name: Documentation-only change
        if: steps.plan.outputs.code != 'true'
        run: echo "No code changes; test suite not required."

  race:
    name: Race Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test suite
        run: go test -race -v ./...

  maintenance:
    name: Manual ${{ inputs.check }}
    if: github.event_name == 'workflow_dispatch' && inputs.check != 'tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Explicit lint run
        if: inputs.check == 'lint'
        run: go run github.com/magefile/mage@v1.15.0 lint
      - name: Explicit race run
        if: inputs.check == 'race'
        run: go test -race -short -v ./...
