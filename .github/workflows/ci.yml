name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      check:
        description: Check to run
        type: choice
        default: tests
        options:
          - tests
          - lint
          - race

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    if: github.event_name != 'workflow_dispatch' || inputs.check == 'tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # setup-go's cache is keyed only on go.sum, so it is saved once and goes
      # stale. Restore the newest cache saved by a main push instead.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            go-tests-${{ runner.os }}-${{ runner.arch }}-
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            go run ./cmd/ciplan -all
          else
            go run ./cmd/ciplan -base "$BASE" -head HEAD
          fi
      - name: Full test suite
        if: steps.plan.outputs.code == 'true'
        run: go test -v ./...
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.code == 'true'
        with:
          node-version: '24'
      - name: Production workflow tests
        if: steps.plan.outputs.code == 'true'
        run: node --test .github/extensions/council4-production/workflow.test.mjs
      - name: Documentation-only change
        if: steps.plan.outputs.code != 'true'
        run: echo "No code changes; test suite not required."
      - name: Save Go cache
        if: github.event_name == 'push' && steps.plan.outputs.code == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  race:
    name: Race Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # setup-go's cache is keyed only on go.sum, so it is saved once and goes
      # stale. Restore the newest cache saved by a main push instead.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-${{ runner.arch }}-
      - name: Race test suite
        run: go test -race -v ./...

  race-cache:
    name: Race build cache
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # setup-go's cache is keyed only on go.sum, so it is saved once and goes
      # stale. Restore the newest cache saved by a main push instead.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-${{ runner.arch }}-
      # Compiles race-instrumented packages and test binaries for later PRs;
      # main's race behavior is verified by the PR that landed it.
      - name: Build race test binaries
        run: go test -race -run '^$' ./...
      - name: Save Go cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  maintenance:
    name: Manual ${{ inputs.check }}
    if: github.event_name == 'workflow_dispatch' && inputs.check != 'tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Explicit lint run
        if: inputs.check == 'lint'
        run: go run github.com/magefile/mage@v1.15.0 lint
      - name: Explicit race run
        if: inputs.check == 'race'
        run: go test -race -short -v ./...
